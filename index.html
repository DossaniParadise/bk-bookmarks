<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPM · BK Bookmark Review</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        :root {
            --navy: #1a2d4a;
            --navy2: #253e63;
            --gold: #c8922a;
            --gold-lt: #f0d080;
            --white: #ffffff;
            --off: #f1f3f4;
            --chrome-bar: #f1f3f4;
            --chrome-bg: #e8eaed;
            --chrome-top: #dee1e6;
            --text: #202124;
            --text2: #5f6368;
            --border: #dadce0;
            --green: #1e8a45;
            --green-bg: #e6f4ea;
            --red: #c5221f;
            --red-bg: #fce8e6;
            --blue: #1a73e8;
            --sans: 'Open Sans', sans-serif;
            --serif: 'Merriweather', Georgia, serif;
            --radius: 4px;
            --chip-h: 28px;
        }

        body {
            font-family: var(--sans);
            background: #e8eaed;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .font-serif { font-family: var(--serif); }
        .font-sans { font-family: var(--sans); }

        /* Custom Chrome Styles */
        .chrome-window {
            max-width: 900px;
            margin: 24px auto;
            border-radius: 10px 10px 6px 6px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.22);
            overflow: visible;
            background: var(--white);
        }

        .bk-chip.removed {
            opacity: 0.45;
            text-decoration: line-through;
            background: var(--red-bg) !important;
            border-color: #f5c6c4;
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-pop {
            animation: modalPop 0.2s ease-out;
        }

        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { 
            LayoutList, 
            BarChart3, 
            ChevronRight, 
            Check, 
            Trash2, 
            Share2, 
            ArrowLeft, 
            Info, 
            HelpCircle, 
            Plus,
            RotateCcw,
            Search,
            X,
            Copy,
            RefreshCw
        } = LucideReact;

        const INITIAL_BOOKMARKS = [
            { name: "RBI", url: "https://rbi.okta.com/" },
            { name: "BK Gateway", url: "https://rbi.okta.com/login/login.htm" },
            { name: "MCP BIG 3", url: "" },
            { name: "Bench Plan", url: "" },
            { name: "Restaurant Services", url: "https://www.rsiweb.com/net/public/PubIndex.aspx" },
            { name: "Paycom", url: "https://www.paycom.com/" },
            { name: "MGRNG Login", url: "https://192.168.1.80/mgrng/index.php" },
            { name: "Bitrix24", url: "https://www.bitrix24.com/" },
            { name: "My Apps", url: "https://rbi.okta.com/app/UserHome" },
            { name: "Cash Connect", url: "https://www.cashconnect.com/login-notice/" },
            { name: "Flowers", url: "https://ffomsi.flocorp.com/clientportal/apps/cpOrderEntry.html" },
            { name: "Zenput", url: "https://www.zenput.com/mobile/" },
            { name: "Rapid Paycard", url: "https://www.rapidclientportal.com/login" }
        ].map((b, i) => ({ ...b, keep: true, id: i }));

        // ── COMPONENTS ──

        function LandingPage({ onSelectView }) {
            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-50 p-6 fade-in">
                    <div className="max-w-4xl w-full">
                        <div className="text-center mb-12">
                            <h1 className="text-4xl md:text-5xl font-bold text-slate-900 mb-4 font-serif">
                                DPM Bookmark Review
                            </h1>
                            <p className="text-lg text-slate-600 max-w-2xl mx-auto">
                                Choose how you'd like to review your Burger King bookmarks. 
                                Simple for a quick list, or Advanced for a detailed graphical view.
                            </p>
                        </div>

                        <div className="grid md:grid-cols-2 gap-8">
                            <button
                                onClick={() => onSelectView('simple')}
                                className="group relative bg-white p-8 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 text-left transition-all hover:shadow-2xl hover:border-blue-200 hover:scale-[1.02] active:scale-[0.98]"
                            >
                                <div className="w-16 h-16 bg-blue-50 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-blue-100 transition-colors">
                                    <LayoutList className="w-8 h-8 text-blue-600" />
                                </div>
                                <h2 className="text-2xl font-bold text-slate-900 mb-3 font-serif">Simple View</h2>
                                <p className="text-slate-600 mb-6 leading-relaxed">
                                    Perfect for a quick review. Large buttons and a step-by-step guide 
                                    to help you keep or remove bookmarks easily.
                                </p>
                                <div className="flex items-center text-blue-600 font-semibold">
                                    Get Started <ChevronRight className="w-4 h-4 ml-1" />
                                </div>
                            </button>

                            <button
                                onClick={() => onSelectView('advanced')}
                                className="group relative bg-white p-8 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 text-left transition-all hover:shadow-2xl hover:border-indigo-200 hover:scale-[1.02] active:scale-[0.98]"
                            >
                                <div className="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-indigo-100 transition-colors">
                                    <BarChart3 className="w-8 h-8 text-indigo-600" />
                                </div>
                                <h2 className="text-2xl font-bold text-slate-900 mb-3 font-serif">Advanced View</h2>
                                <p className="text-slate-600 mb-6 leading-relaxed">
                                    A graphical dashboard showing your bookmark status with 
                                    detailed analytics and a modern interface.
                                </p>
                                <div className="flex items-center text-indigo-600 font-semibold">
                                    Explore Dashboard <ChevronRight className="w-4 h-4 ml-1" />
                                </div>
                            </button>
                        </div>

                        <div className="mt-16 text-center text-slate-400 text-sm">
                            Dossani Paradise Management · Internal Tool
                        </div>
                    </div>
                </div>
            );
        }

        function SimpleView({ bookmarks, onToggleKeep, onAddBookmark, onBack, onGenerateCode }) {
            const [showTutorial, setShowTutorial] = useState(false);
            const [tutorialStep, setTutorialStep] = useState(0);
            const [showAddModal, setShowAddModal] = useState(false);
            const [newName, setNewName] = useState('');
            const [newUrl, setNewUrl] = useState('');

            useEffect(() => {
                const hasSeenTutorial = localStorage.getItem('hasSeenSimpleTutorial');
                if (!hasSeenTutorial) {
                    setShowTutorial(true);
                }
            }, []);

            const closeTutorial = () => {
                setShowTutorial(false);
                localStorage.setItem('hasSeenSimpleTutorial', 'true');
            };

            const tutorialSteps = [
                {
                    title: "Welcome to Simple View!",
                    content: "This view is designed to be easy to use. Let's walk through how to review your bookmarks.",
                    icon: <HelpCircle className="w-12 h-12 text-blue-500" />
                },
                {
                    title: "Keep or Delete",
                    content: "For each bookmark, you can choose to 'Keep' it (green check) or 'Delete' it (red trash).",
                    icon: <div className="flex gap-4"><Check className="w-10 h-10 text-green-500" /><Trash2 className="w-10 h-10 text-red-500" /></div>
                },
                {
                    title: "Share Your Work",
                    content: "When you're finished, click the 'Generate Share Code' button at the bottom to share your choices.",
                    icon: <Share2 className="w-12 h-12 text-indigo-500" />
                }
            ];

            return (
                <div className="min-h-screen bg-slate-50 pb-24 fade-in">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-10 px-4 py-4 md:px-8">
                        <div className="max-w-4xl mx-auto flex items-center justify-between">
                            <button onClick={onBack} className="flex items-center text-slate-600 hover:text-slate-900 transition-colors font-medium">
                                <ArrowLeft className="w-5 h-5 mr-2" />
                                <span className="hidden sm:inline">Back</span>
                            </button>
                            <h1 className="text-xl font-bold text-slate-900 font-serif">Simple Review</h1>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setShowAddModal(true)} className="p-2 text-blue-600 hover:bg-blue-50 rounded-xl transition-colors">
                                    <Plus className="w-6 h-6" />
                                </button>
                                <button onClick={() => setShowTutorial(true)} className="p-2 text-slate-400 hover:text-blue-500 transition-colors">
                                    <Info className="w-6 h-6" />
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto p-4 md:p-8">
                        <div className="space-y-4">
                            {bookmarks.map((bookmark) => (
                                <div key={bookmark.id} className={`bg-white p-6 rounded-2xl shadow-sm border transition-all ${bookmark.keep ? 'border-slate-100' : 'border-red-100 bg-red-50/30 opacity-75'}`}>
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-6">
                                        <div className="flex-1 min-w-0">
                                            <h3 className={`text-xl font-bold mb-1 truncate ${!bookmark.keep && 'line-through text-slate-400'}`}>
                                                {bookmark.name}
                                            </h3>
                                            <p className="text-slate-500 text-sm truncate">{bookmark.url || 'No URL provided'}</p>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <button onClick={() => onToggleKeep(bookmark.id, true)} className={`flex-1 sm:flex-none flex items-center justify-center gap-2 px-6 py-3 rounded-xl font-bold transition-all ${bookmark.keep ? 'bg-green-500 text-white shadow-lg shadow-green-200' : 'bg-slate-100 text-slate-400 hover:bg-slate-200'}`}>
                                                <Check className="w-5 h-5" /> Keep
                                            </button>
                                            <button onClick={() => onToggleKeep(bookmark.id, false)} className={`flex-1 sm:flex-none flex items-center justify-center gap-2 px-6 py-3 rounded-xl font-bold transition-all ${!bookmark.keep ? 'bg-red-500 text-white shadow-lg shadow-red-200' : 'bg-slate-100 text-slate-400 hover:bg-slate-200'}`}>
                                                <Trash2 className="w-5 h-5" /> Delete
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-4 md:p-6 shadow-2xl z-10">
                        <div className="max-w-4xl mx-auto">
                            <button onClick={onGenerateCode} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-2xl font-bold text-lg shadow-xl shadow-indigo-200 flex items-center justify-center gap-3 transition-all active:scale-95">
                                <Share2 className="w-6 h-6" /> Generate Share Code
                            </button>
                        </div>
                    </div>

                    {/* Tutorial Modal */}
                    {showTutorial && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl modal-pop">
                                <div className="flex justify-center mb-6">{tutorialSteps[tutorialStep].icon}</div>
                                <h2 className="text-2xl font-bold text-center mb-4 text-slate-900">{tutorialSteps[tutorialStep].title}</h2>
                                <p className="text-slate-600 text-center text-lg mb-8 leading-relaxed">{tutorialSteps[tutorialStep].content}</p>
                                <div className="flex gap-4">
                                    {tutorialStep > 0 && <button onClick={() => setTutorialStep(s => s - 1)} className="flex-1 py-4 bg-slate-100 text-slate-600 font-bold rounded-2xl hover:bg-slate-200 transition-colors">Back</button>}
                                    <button onClick={() => tutorialStep < tutorialSteps.length - 1 ? setTutorialStep(s => s + 1) : closeTutorial()} className="flex-2 py-4 bg-blue-600 text-white font-bold rounded-2xl hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all">
                                        {tutorialStep < tutorialSteps.length - 1 ? 'Next' : 'Got it!'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Add Modal */}
                    {showAddModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl modal-pop">
                                <h2 className="text-2xl font-bold mb-6 text-slate-900">Add New Bookmark</h2>
                                <div className="space-y-4 mb-8">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-400 uppercase tracking-widest mb-2">Name</label>
                                        <input type="text" value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="e.g. Payroll Dashboard" className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-400 uppercase tracking-widest mb-2">URL</label>
                                        <input type="text" value={newUrl} onChange={(e) => setNewUrl(e.target.value)} placeholder="https://example.com" className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all" />
                                    </div>
                                </div>
                                <div className="flex gap-4">
                                    <button onClick={() => setShowAddModal(false)} className="flex-1 py-4 bg-slate-100 text-slate-600 font-bold rounded-2xl hover:bg-slate-200 transition-colors">Cancel</button>
                                    <button onClick={() => { if (newName) { onAddBookmark(newName, newUrl); setNewName(''); setNewUrl(''); setShowAddModal(false); } }} className="flex-1 py-4 bg-blue-600 text-white font-bold rounded-2xl hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all">Add</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function AdvancedView({ bookmarks, onToggleKeep, onAddBookmark, onReorder, onBack, onGenerateCode }) {
            const [dragId, setDragId] = useState(null);
            const [showAddModal, setShowAddModal] = useState(false);
            const [newName, setNewName] = useState('');
            const [newUrl, setNewUrl] = useState('');

            const keptCount = bookmarks.filter(b => b.keep).length;
            const removedCount = bookmarks.length - keptCount;

            const handleDragStart = (id) => setDragId(id);
            const handleDragOver = (e) => e.preventDefault();
            const handleDrop = (targetId) => {
                if (dragId === null || dragId === targetId) return;
                const fromIndex = bookmarks.findIndex(b => b.id === dragId);
                const toIndex = bookmarks.findIndex(b => b.id === targetId);
                const newBookmarks = [...bookmarks];
                const [movedItem] = newBookmarks.splice(fromIndex, 1);
                newBookmarks.splice(toIndex, 0, movedItem);
                onReorder(newBookmarks);
                setDragId(null);
            };
            const handleTrashDrop = (e) => {
                e.preventDefault();
                if (dragId !== null) { onToggleKeep(dragId, false); setDragId(null); }
            };

            const getFavicon = (url) => {
                if (!url) return null;
                try { return `https://www.google.com/s2/favicons?domain=${new URL(url).hostname}&sz=32`; }
                catch { return null; }
            };

            return (
                <div className="min-h-screen bg-[#e8eaed] font-sans text-[#202124] fade-in">
                    <div className="bg-[#1a2d4a] border-b-[3px] border-[#c8922a] px-5 h-[52px] flex items-center justify-between">
                        <div className="flex flex-col">
                            <div className="font-serif text-sm text-white tracking-tight">Dossani Paradise Management</div>
                            <div className="text-[10px] font-light text-[#f0d080] tracking-[0.12em] uppercase opacity-85">Burger King · Bookmark Review</div>
                        </div>
                        <div className="text-[11px] text-white/35 uppercase tracking-widest">Internal Use Only</div>
                    </div>

                    <div className="chrome-window">
                        <div className="bg-[#dee1e6] h-[38px] flex items-end px-4 relative">
                            <div className="flex gap-[7px] absolute left-4 top-1/2 -translate-y-1/2">
                                <div className="w-3 h-3 rounded-full bg-[#ff5f57]"></div>
                                <div className="w-3 h-3 rounded-full bg-[#febc2e]"></div>
                                <div className="w-3 h-3 rounded-full bg-[#28c840]"></div>
                            </div>
                            <div className="ml-16 bg-white rounded-t-lg h-[33px] min-w-[180px] flex items-center px-3 gap-2 text-xs text-[#202124]">
                                <div className="w-4 h-4 bg-slate-100 rounded-sm flex items-center justify-center text-[10px] font-bold text-slate-400">BK</div>
                                <span className="flex-1 truncate">BK Bookmarks — DPM Review</span>
                                <div className="w-4 h-4 rounded-full hover:bg-slate-100 flex items-center justify-center cursor-pointer text-[#5f6368]">✕</div>
                            </div>
                        </div>

                        <div className="bg-white p-2 px-3.5 flex items-center gap-2.5 border-b border-[#dadce0]">
                            <button className="w-7 h-7 rounded-full hover:bg-[#e8eaed] flex items-center justify-center text-[#5f6368] disabled:opacity-30" onClick={onBack}>
                                <ArrowLeft className="w-4 h-4" />
                            </button>
                            <button className="w-7 h-7 rounded-full hover:bg-[#e8eaed] flex items-center justify-center text-[#5f6368] rotate-180 disabled:opacity-30" disabled>
                                <ArrowLeft className="w-4 h-4" />
                            </button>
                            <button className="w-7 h-7 rounded-full hover:bg-[#e8eaed] flex items-center justify-center text-[#5f6368]">
                                <RotateCcw className="w-4 h-4" />
                            </button>
                            <div className="flex-1 bg-[#e8eaed] rounded-full h-8 flex items-center px-3.5 gap-1.5 text-sm text-[#5f6368]">
                                <Search className="w-3.5 h-3.5 flex-shrink-0" />
                                <span className="flex-1 text-[#202124] truncate">dpm-bk-bookmarks · internal tool</span>
                            </div>
                            <button onClick={() => setShowAddModal(true)} className="w-7 h-7 rounded-full hover:bg-[#e8eaed] flex items-center justify-center text-[#1a73e8]">
                                <Plus className="w-5 h-5" />
                            </button>
                        </div>

                        <div className="bg-white border-b border-[#dadce0] p-1 px-2.5 min-h-[36px] flex items-center flex-wrap gap-0.5">
                            <span className="text-[11px] text-[#5f6368] mr-1 whitespace-nowrap select-none">Bookmarks bar</span>
                            {bookmarks.map((bk) => (
                                <div key={bk.id} draggable onDragStart={() => handleDragStart(bk.id)} onDragOver={handleDragOver} onDrop={() => handleDrop(bk.id)} className={`group relative inline-flex items-center gap-1.5 h-7 px-2 rounded hover:bg-[#e8eaed] text-xs text-[#202124] cursor-grab active:cursor-grabbing max-w-[160px] transition-all ${!bk.keep ? 'opacity-45 line-through bg-[#fce8e6] border border-[#f5c6c4]' : ''} ${dragId === bk.id ? 'opacity-25' : ''}`}>
                                    {getFavicon(bk.url) ? <img src={getFavicon(bk.url)} className="w-4 h-4 rounded-sm flex-shrink-0 object-contain" /> : <div className="w-4 h-4 rounded-sm bg-[#e8eaed] flex items-center justify-center text-[9px] font-bold text-[#5f6368] flex-shrink-0 uppercase">{bk.name[0]}</div>}
                                    <span className="truncate flex-1">{bk.name}</span>
                                    <div className="hidden group-hover:flex items-center gap-0.5 ml-0.5">
                                        <button onClick={(e) => { e.stopPropagation(); onToggleKeep(bk.id, true); }} className={`w-[18px] h-[18px] rounded flex items-center justify-center text-[10px] ${bk.keep ? 'bg-[#1e8a45] text-white' : 'bg-[#e6f4ea] text-[#1e8a45] hover:bg-[#c8e6c9]'}`}>✓</button>
                                        <button onClick={(e) => { e.stopPropagation(); onToggleKeep(bk.id, false); }} className={`w-[18px] h-[18px] rounded flex items-center justify-center text-[10px] ${!bk.keep ? 'bg-[#c5221f] text-white' : 'bg-[#fce8e6] text-[#c5221f] hover:bg-[#ffcdd2]'}`}>✕</button>
                                    </div>
                                </div>
                            ))}
                            <button onClick={() => setShowAddModal(true)} className="h-7 px-2.5 rounded border border-dashed border-[#dadce0] hover:bg-[#e8eaed] hover:text-[#202124] text-xs text-[#5f6368] flex items-center gap-1 transition-colors">
                                <span className="text-base leading-none">+</span> Add bookmark
                            </button>
                        </div>

                        <div onDragOver={handleDragOver} onDrop={handleTrashDrop} className="bg-white border-b border-dashed border-[#dadce0] p-3 px-4.5 flex items-center gap-3 min-h-[56px] group hover:bg-[#fce8e6] hover:border-[#c5221f] transition-all">
                            <Trash2 className="w-5 h-5 text-[#5f6368] opacity-35 group-hover:opacity-75 group-hover:scale-110 transition-all" />
                            <div className="flex-1">
                                <p className="text-xs text-[#5f6368] font-light group-hover:text-[#c5221f] group-hover:font-normal transition-colors">Drag a bookmark here to remove it</p>
                                <div className="flex flex-wrap gap-1.5 mt-2">
                                    {bookmarks.filter(b => !b.keep).map(bk => (
                                        <button key={bk.id} onClick={() => onToggleKeep(bk.id, true)} className="inline-flex items-center gap-1.5 h-6 px-2 bg-[#fce8e6] border border-[#f5c6c4] rounded text-[11px] text-[#c5221f] hover:bg-[#fde0de] transition-colors">
                                            {getFavicon(bk.url) ? <img src={getFavicon(bk.url)} className="w-3.5 h-3.5 rounded-sm" /> : <div className="w-3.5 h-3.5 rounded-sm bg-white flex items-center justify-center text-[8px] font-bold uppercase">{bk.name[0]}</div>}
                                            <span>{bk.name}</span><span className="text-[#1e8a45] font-bold ml-0.5">↩</span>
                                        </button>
                                    ))}
                                    {bookmarks.filter(b => !b.keep).length === 0 && <span className="text-xs text-[#5f6368] opacity-50 italic">Nothing removed yet</span>}
                                </div>
                            </div>
                        </div>

                        <div className="bg-[#f1f3f4] p-7 min-h-[340px]">
                            <div className="flex gap-2 mb-4">
                                <div className="text-[11px] font-semibold uppercase tracking-wider px-2.5 py-0.5 rounded-sm border border-[#dadce0] bg-white text-[#5f6368]">{bookmarks.length} total</div>
                                <div className="text-[11px] font-semibold uppercase tracking-wider px-2.5 py-0.5 rounded-sm border border-[#b5d6c0] bg-[#e6f4ea] text-[#1e8a45]">{keptCount} kept</div>
                                {removedCount > 0 && <div className="text-[11px] font-semibold uppercase tracking-wider px-2.5 py-0.5 rounded-sm border border-[#f5c6c4] bg-[#fce8e6] text-[#c5221f]">{removedCount} removed</div>}
                            </div>
                            <div className="flex items-center gap-3.5 flex-wrap mb-1.5">
                                <button onClick={onGenerateCode} className="bg-[#1a2d4a] hover:bg-[#253e63] text-white text-xs font-semibold uppercase tracking-wider px-5 py-2.5 rounded transition-all">Generate Share Code</button>
                                <span className="text-xs text-[#5f6368] font-light">Encodes your full configuration — works on any device.</span>
                            </div>
                            <div className="mt-8 border-t border-[#dadce0] pt-3 flex justify-between text-[11px] text-[#999] font-light">
                                <span>Dossani Paradise Management · 520 E. Northwest Hwy Suite 100, Grapevine TX 76051</span>
                                <span>817-442-1159</span>
                            </div>
                        </div>
                    </div>

                    {showAddModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/35 backdrop-blur-[2px]">
                            <div className="bg-white rounded-lg p-5 w-[360px] shadow-2xl modal-pop">
                                <h3 className="font-serif text-[15px] font-bold text-[#1a2d4a] mb-3.5">Add Bookmark</h3>
                                <div className="space-y-3.5 mb-4">
                                    <div>
                                        <label className="block text-[11px] font-semibold text-[#5f6368] uppercase tracking-wider mb-1">Name</label>
                                        <input type="text" value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="e.g. Payroll Dashboard" className="w-full px-2.5 py-2 border border-[#dadce0] rounded text-sm outline-none focus:border-[#1a2d4a] transition-colors" />
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-semibold text-[#5f6368] uppercase tracking-wider mb-1">URL</label>
                                        <input type="text" value={newUrl} onChange={(e) => setNewUrl(e.target.value)} placeholder="https://example.com" className="w-full px-2.5 py-2 border border-[#dadce0] rounded text-sm outline-none focus:border-[#1a2d4a] transition-colors" />
                                    </div>
                                </div>
                                <div className="flex justify-end gap-2">
                                    <button onClick={() => setShowAddModal(false)} className="px-4 py-1.5 border border-[#dadce0] rounded text-xs text-[#5f6368] hover:bg-[#f1f3f4] transition-colors">Cancel</button>
                                    <button onClick={() => { if (newName) { onAddBookmark(newName, newUrl); setNewName(''); setNewUrl(''); setShowAddModal(false); } }} className="px-4 py-1.5 bg-[#1a2d4a] text-white rounded text-xs font-semibold hover:bg-[#253e63] transition-colors">Add</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function ShareCode({ code, onClose, onDecode }) {
            const [copied, setCopied] = useState(false);
            const [inputCode, setInputCode] = useState('');
            const copyToClipboard = () => { navigator.clipboard.writeText(code); setCopied(true); setTimeout(() => setCopied(false), 2000); };
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                    <div className="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl relative overflow-hidden modal-pop">
                        <button onClick={onClose} className="absolute top-4 right-4 p-2 text-slate-400 hover:text-slate-900 transition-colors"><X className="w-6 h-6" /></button>
                        <div className="flex justify-center mb-6"><div className="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600"><Share2 className="w-8 h-8" /></div></div>
                        <h2 className="text-2xl font-bold text-center mb-2 text-slate-900">Share Your Review</h2>
                        <p className="text-slate-500 text-center mb-8">Copy this code to share your bookmark choices with others.</p>
                        <div className="bg-slate-50 p-6 rounded-2xl border border-slate-100 mb-8">
                            <div className="flex items-center justify-between gap-4">
                                <div className="flex-1 font-mono text-2xl font-bold tracking-widest text-indigo-600 truncate">{code}</div>
                                <button onClick={copyToClipboard} className={`p-3 rounded-xl transition-all ${copied ? 'bg-green-500 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:border-indigo-500 hover:text-indigo-600'}`}>
                                    {copied ? <Check className="w-5 h-5" /> : <Copy className="w-5 h-5" />}
                                </button>
                            </div>
                        </div>
                        <div className="border-t border-slate-100 pt-8 mt-4">
                            <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4">Import a Code</h3>
                            <div className="flex gap-2">
                                <input type="text" value={inputCode} onChange={(e) => setInputCode(e.target.value.toUpperCase())} placeholder="ENTER CODE" className="flex-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl font-mono text-lg tracking-widest focus:ring-2 focus:ring-indigo-500 outline-none transition-all" />
                                <button onClick={() => onDecode(inputCode)} className="px-4 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-colors flex items-center gap-2"><RefreshCw className="w-5 h-5" />Load</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ── MAIN APP ──

        function App() {
            const [viewMode, setViewMode] = useState('landing');
            const [bookmarks, setBookmarks] = useState(INITIAL_BOOKMARKS);
            const [shareCode, setShareCode] = useState(null);

            useEffect(() => {
                const saved = localStorage.getItem('dpm_bookmarks');
                if (saved) { try { setBookmarks(JSON.parse(saved)); } catch (e) {} }
            }, []);

            useEffect(() => { localStorage.setItem('dpm_bookmarks', JSON.stringify(bookmarks)); }, [bookmarks]);

            const handleToggleKeep = (id, keep) => setBookmarks(prev => prev.map(b => b.id === id ? { ...b, keep } : b));
            const handleAddBookmark = (name, url) => setBookmarks(prev => [...prev, { id: Date.now(), name, url, keep: true }]);
            const handleReorder = (newBks) => setBookmarks(newBks);
            const handleGenerateCode = () => {
                const data = bookmarks.map(b => ({ n: b.name, u: b.url, k: b.keep ? 1 : 0 }));
                setShareCode(btoa(JSON.stringify(data)));
            };
            const handleDecode = (code) => {
                try {
                    const data = JSON.parse(atob(code));
                    setBookmarks(data.map((item, i) => ({ id: Date.now() + i, name: item.n, url: item.u, keep: item.k === 1 })));
                    setShareCode(null);
                    alert('Loaded!');
                } catch (e) { alert('Invalid code'); }
            };

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-900">
                    {viewMode === 'landing' && <LandingPage onSelectView={setViewMode} />}
                    {viewMode === 'simple' && <SimpleView bookmarks={bookmarks} onToggleKeep={handleToggleKeep} onAddBookmark={handleAddBookmark} onBack={() => setViewMode('landing')} onGenerateCode={handleGenerateCode} />}
                    {viewMode === 'advanced' && <AdvancedView bookmarks={bookmarks} onToggleKeep={handleToggleKeep} onAddBookmark={handleAddBookmark} onReorder={handleReorder} onBack={() => setViewMode('landing')} onGenerateCode={handleGenerateCode} />}
                    {shareCode && <ShareCode code={shareCode} onClose={() => setShareCode(null)} onDecode={handleDecode} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
